<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="920" height="260" viewBox="0 0 920 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">STEM Sprout — Primary Logo</title>
  <desc id="desc">A clean, modern wordmark with a sprout emblem symbolizing growth and STEM learning for a Montessori to Grade 5 school.</desc>

  <!-- Background (transparent) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Emblem: rounded square with simple sprout -->
  <defs>
    <linearGradient id="g-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18C964"/>
      <stop offset="100%" stop-color="#0B8F46"/>
    </linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#45AAF2"/>
      <stop offset="100%" stop-color="#2E86DE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon container -->
  <g transform="translate(30,30)">
    <!-- soft background badge -->
    <rect x="0" y="0" width="200" height="200" rx="28" fill="url(#g-sky)" filter="url(#soft)"/>
    <!-- soil arc -->
    <path d="M20,160 Q100,115 180,160 L180,200 L20,200 Z" fill="#0B8F46" opacity="0.12"/>
    <!-- sprout stem -->
    <path d="M100,155 C100,135 103,120 110,105" stroke="#0B8F46" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- left leaf -->
    <path d="M95,120 C75,118 58,106 52,90 C49,82 55,74 66,73 C83,72 103,82 113,96 C101,103 94,112 95,120 Z"
          fill="url(#g-leaf)"/>
    <!-- right leaf -->
    <path d="M114,108 C126,92 148,83 163,86 C172,88 176,96 171,103 C162,116 140,124 122,124 C120,118 118,112 114,108 Z"
          fill="url(#g-leaf)"/>
    <!-- small sparkle dots to hint 'STEM' wonder -->
    <circle cx="52" cy="58" r="3" fill="#ffffff" opacity="0.85"/>
    <circle cx="168" cy="52" r="2.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="140" cy="28" r="2.5" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(260,75)">
    <!-- Top line: STEM -->
    <text x="0" y="0" font-family="Montserrat, Arial, Helvetica, sans-serif" font-weight="800"
          font-size="64" fill="#1B1E28" dominant-baseline="hanging" letter-spacing="1">
      STEM
    </text>
    <!-- Accent dot between words (subtle tech cue) -->
    <circle cx="245" cy="10" r="6" fill="#2E86DE" />
    <!-- Second word: Sprout -->
    <text x="265" y="0" font-family="Montserrat, Arial, Helvetica, sans-serif" font-weight="700"
          font-size="64" fill="#0B8F46" dominant-baseline="hanging">
      Sprout
    </text>

    <!-- Tagline (optional; can be removed in small use) -->
    <text x="0" y="88" font-family="Montserrat, Arial, Helvetica, sans-serif" font-weight="500"
          font-size="20" fill="#586174">
      Montessori to Grade 5 • Curiosity to Creativity
    </text>
  </g>

  <!-- Clearspace guide (hidden by default; set opacity=0.2 to view) -->
  <g opacity="0">
    <rect x="10" y="10" width="900" height="240" fill="none" stroke="#FF8C00" stroke-dasharray="6 8"/>
  </g>
</svg>
