<!-- class area start -->
<section class="rts-class-area">
    <div class="container">
        <div class="section-title-area text-center">
            <p class="pre-title justify-content-center"><img src="assets/images/banner/title-img.svg" alt="">Classes</p>
            <h2 class="section-title">Find Classes For Every Age</h2>
            <p class="desc">Marked by significant growth and exploration as <br> toddlers transition from infancy</p>
        </div>
        <div class="section-inner">
            <div class="row g-5">
                <div class="col-lg-3 col-md-6 col-sm-6" *ngFor="let class of classes">
                    <div class="class-wrapper" [ngClass]="class.color">
                        <div class="wrapper-inner">
                            <div class="icon">
                                <img [src]="class.icon" [alt]="class.title">
                            </div>
                            <a [routerLink]="class.link">
                                <h4 class="title">{{class.title}}</h4>
                            </a>
                            <p class="period">{{class.period}}</p>
                            <p class="desc">{{class.description}}</p>
                            <div class="shape-icon"><img src="assets/images/banner/blink.svg" alt=""></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- class area end -->
