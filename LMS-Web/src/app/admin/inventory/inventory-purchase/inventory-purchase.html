<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;">
  <div>
    <h2 style="margin:0;font-size:1.3rem;">Record Purchase</h2>
    <p style="margin:2px 0 0;color:#64748b;font-size:0.85rem;">Stock-in from a vendor. Each line increases current stock.</p>
  </div>
  <a routerLink="/admin/inventory" class="p-button p-component p-button-outlined" style="text-decoration:none;">
    <i class="pi pi-arrow-left" style="margin-right:6px;"></i> Back
  </a>
</div>

<div style="max-width:920px;">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px;">
    <div><label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Purchase Date *</label>
      <p-datepicker [(ngModel)]="purchaseDate" dateFormat="dd M yy" [showIcon]="true" [fluid]="true" appendTo="body"></p-datepicker></div>
    <div><label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Vendor Name *</label>
      <input pInputText [(ngModel)]="vendorName" style="width:100%;" /></div>
    <div><label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Vendor Invoice No</label>
      <input pInputText [(ngModel)]="vendorInvoiceNo" style="width:100%;" /></div>
    <div><label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Payment Mode</label>
      <p-select [options]="modeOptions" optionLabel="label" optionValue="value" [(ngModel)]="paymentMode" [style]="{ width: '100%' }" appendTo="body"></p-select></div>
  </div>

  <!-- Lines -->
  <h3 style="font-size:1rem;margin:0 0 8px;">Items</h3>
  <p-table [value]="lines()" styleClass="p-datatable-sm p-datatable-gridlines" [tableStyle]="{ 'min-width': '54rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Item</th>
        <th style="width:150px;">Quantity</th>
        <th style="width:170px;">Unit Price</th>
        <th style="width:150px;">Line Total</th>
        <th style="width:60px;"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-line let-idx="rowIndex">
      <tr>
        <td><p-select [options]="itemOptions()" optionLabel="label" optionValue="value" [(ngModel)]="line.itemId" [filter]="true" [style]="{ width: '100%' }" appendTo="body" placeholder="Select item"></p-select></td>
        <td><p-inputnumber [(ngModel)]="line.quantity" [min]="0" [minFractionDigits]="0" [maxFractionDigits]="2" [fluid]="true"></p-inputnumber></td>
        <td><p-inputnumber [(ngModel)]="line.unitPrice" mode="currency" currency="PKR" [fluid]="true"></p-inputnumber></td>
        <td><strong>Rs. {{ lineTotal(line) | number:'1.0-0' }}</strong></td>
        <td><p-button icon="pi pi-times" severity="danger" size="small" [text]="true" (onClick)="removeLine(idx)" [disabled]="lines().length === 1"></p-button></td>
      </tr>
    </ng-template>
  </p-table>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
    <p-button label="Add Line" icon="pi pi-plus" severity="secondary" [outlined]="true" (onClick)="addLine()"></p-button>
    <div style="font-size:1.1rem;font-weight:600;">Grand Total: Rs. {{ grandTotal() | number:'1.0-0' }}</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;">
    <div><label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Notes</label>
      <textarea pTextarea [(ngModel)]="notes" rows="2" style="width:100%;"></textarea></div>
    <div><label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Invoice Attachment</label>
      <input type="file" (change)="onFileSelect($event)" />
      @if (uploading()) { <small style="color:#64748b;display:block;margin-top:4px;">Uploading…</small> }
      @if (attachmentPath()) { <small style="color:#16a34a;display:block;margin-top:4px;">Uploaded ✓</small> }</div>
  </div>

  <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;">
    <p-button label="Record Purchase" icon="pi pi-check" [loading]="saving()" (onClick)="save()"></p-button>
  </div>
</div>
