<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;">
  <div>
    <h2 style="margin:0;font-size:1.3rem;">Issue Items</h2>
    <p style="margin:2px 0 0;color:#64748b;font-size:0.85rem;">Stock-out to a class, teacher, department or student.</p>
  </div>
  <a routerLink="/admin/inventory" class="p-button p-component p-button-outlined" style="text-decoration:none;">
    <i class="pi pi-arrow-left" style="margin-right:6px;"></i> Back
  </a>
</div>

<div style="max-width:880px;">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px;">
    <div><label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Issue Date *</label>
      <p-datepicker [(ngModel)]="issueDate" dateFormat="dd M yy" [showIcon]="true" [fluid]="true" appendTo="body"></p-datepicker></div>
    <div><label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Issued To Type *</label>
      <p-select [options]="typeOptions" optionLabel="label" optionValue="value" [(ngModel)]="issuedToType" [style]="{ width: '100%' }" appendTo="body"></p-select></div>
    <div><label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Recipient Name *</label>
      <input pInputText [(ngModel)]="issuedToName" placeholder="e.g. Grade 3, Ms. Sara" style="width:100%;" /></div>
    <div><label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Recipient ID (optional)</label>
      <p-inputnumber [(ngModel)]="issuedToId" [useGrouping]="false" [fluid]="true"></p-inputnumber></div>
  </div>

  <h3 style="font-size:1rem;margin:0 0 8px;">Items</h3>
  <p-table [value]="lines()" styleClass="p-datatable-sm p-datatable-gridlines" [tableStyle]="{ 'min-width': '46rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Item</th>
        <th style="width:150px;">Quantity</th>
        <th style="width:120px;">In Stock</th>
        <th style="width:60px;"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-line let-idx="rowIndex">
      <tr>
        <td><p-select [options]="itemOptions()" optionLabel="label" optionValue="value" [(ngModel)]="line.itemId" (onChange)="onItemChange(line)" [filter]="true" [style]="{ width: '100%' }" appendTo="body" placeholder="Select item"></p-select></td>
        <td><p-inputnumber [(ngModel)]="line.quantity" [min]="0" [minFractionDigits]="0" [maxFractionDigits]="2" [fluid]="true"></p-inputnumber></td>
        <td [style.color]="line.itemId && line.quantity > line.stock ? '#dc2626' : '#64748b'">{{ line.itemId ? (line.stock | number:'1.0-2') : '—' }}</td>
        <td><p-button icon="pi pi-times" severity="danger" size="small" [text]="true" (onClick)="removeLine(idx)" [disabled]="lines().length === 1"></p-button></td>
      </tr>
    </ng-template>
  </p-table>

  <div style="margin-top:10px;">
    <p-button label="Add Line" icon="pi pi-plus" severity="secondary" [outlined]="true" (onClick)="addLine()"></p-button>
  </div>

  <div style="margin-top:16px;">
    <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Purpose</label>
    <textarea pTextarea [(ngModel)]="purpose" rows="2" style="width:100%;max-width:520px;" placeholder="Reason / usage"></textarea>
  </div>

  <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;">
    <p-button label="Issue Items" icon="pi pi-check" [loading]="saving()" (onClick)="save()"></p-button>
  </div>
</div>
