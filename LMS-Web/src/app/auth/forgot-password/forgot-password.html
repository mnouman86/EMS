<div class="auth-shell">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:24px;">
      <i class="pi pi-key" style="font-size:2rem;color:#2563eb;"></i>
      <h2 style="margin:10px 0 2px;font-size:1.3rem;">Forgot password</h2>
      <p style="color:#64748b;margin:0;font-size:0.85rem;">We'll email you a reset link</p>
    </div>

    @if (doneMsg()) {
      <p-message severity="success" [text]="doneMsg()!" [style]="{ display: 'block', marginBottom: '16px' }"></p-message>
      <a routerLink="/login" class="p-button p-component" style="width:100%;display:block;text-align:center;">Back to sign in</a>
    } @else {
      @if (errorMsg()) {
        <p-message severity="error" [text]="errorMsg()!" [style]="{ display: 'block', marginBottom: '16px' }"></p-message>
      }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div style="margin-bottom:18px;">
          <label for="email" style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;">Email</label>
          <input id="email" type="email" pInputText formControlName="email" placeholder="you@tsss.com.pk" style="width:100%;" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <small style="color:#ef4444;">Enter a valid email address.</small>
          }
        </div>
        <p-button type="submit" label="Send reset link" [loading]="loading()" [style]="{ width: '100%' }"></p-button>
        <div style="text-align:center;margin-top:14px;">
          <a routerLink="/login" style="font-size:0.82rem;color:#2563eb;">Back to sign in</a>
        </div>
      </form>
    }
  </div>
</div>
