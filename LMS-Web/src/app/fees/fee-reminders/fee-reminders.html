<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;">
  <div>
    <h2 style="margin:0;font-size:1.3rem;">Fee Reminders</h2>
    <p style="margin:2px 0 0;color:#64748b;font-size:1.1rem;">Send WhatsApp / SMS reminders to families with outstanding fees.</p>
  </div>
  <a routerLink="/admin/fees" class="p-button p-component p-button-outlined" style="text-decoration:none;">
    <i class="pi pi-arrow-left" style="margin-right:6px;"></i> Back
  </a>
</div>

<div style="max-width:620px;display:flex;flex-direction:column;gap:14px;">
  <div>
    <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Channel *</label>
    <p-select [options]="channelOptions" optionLabel="label" optionValue="value" [(ngModel)]="channel" [style]="{ width: '100%' }"></p-select>
  </div>
  <div>
    <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Students (leave empty to send to all with outstanding)</label>
    <p-multiselect [options]="studentOptions()" optionLabel="label" optionValue="value" [(ngModel)]="studentIds" [filter]="true" [style]="{ width: '100%' }" display="chip" placeholder="All defaulters"></p-multiselect>
  </div>
  <div>
    <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;">Custom message (optional)</label>
    <textarea pTextarea [(ngModel)]="customBody" rows="3" style="width:100%;" placeholder="Leave blank to use the default reminder template"></textarea>
  </div>
  <div style="display:flex;justify-content:flex-end;">
    <p-button label="Send Reminders" icon="pi pi-send" [loading]="sending()" (onClick)="send()"></p-button>
  </div>

  @if (result(); as r) {
    <p-message severity="success" [style]="{ display: 'block' }">
      Targeted {{ r.targetCount }} · Sent {{ r.sentCount }} · Failed {{ r.failedCount }}
    </p-message>
  }
</div>
