<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;">
  <div>
    <h2 style="margin:0;font-size:1.3rem;">Grade Bands</h2>
    <p style="margin:2px 0 0;color:#64748b;font-size:0.85rem;">Percentage thresholds mapped to grades and remark templates. Saving replaces the full set.</p>
  </div>
  <a routerLink="/admin/results" class="p-button p-component p-button-outlined" style="text-decoration:none;"><i class="pi pi-arrow-left" style="margin-right:6px;"></i> Back</a>
</div>

<p-table [value]="rows()" [loading]="loading()" styleClass="p-datatable-sm p-datatable-gridlines" [tableStyle]="{ 'min-width': '54rem' }">
  <ng-template pTemplate="header">
    <tr>
      <th style="width:120px;">Grade</th><th style="width:120px;">Min %</th><th style="width:120px;">Max %</th>
      <th>Remark Template</th><th style="width:60px;"></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-b let-idx="rowIndex">
    <tr>
      <td><input pInputText [(ngModel)]="b.grade" placeholder="A+" style="width:100%;" /></td>
      <td><p-inputnumber [(ngModel)]="b.minPercent" [min]="0" [max]="100" [minFractionDigits]="0" [maxFractionDigits]="2" [fluid]="true"></p-inputnumber></td>
      <td><p-inputnumber [(ngModel)]="b.maxPercent" [min]="0" [max]="100" [minFractionDigits]="0" [maxFractionDigits]="2" [fluid]="true"></p-inputnumber></td>
      <td><input pInputText [(ngModel)]="b.remarkTemplate" placeholder="Outstanding" style="width:100%;" /></td>
      <td><p-button icon="pi pi-times" severity="danger" size="small" [text]="true" (onClick)="removeRow(idx)" [disabled]="rows().length === 1"></p-button></td>
    </tr>
  </ng-template>
</p-table>

<div style="display:flex;justify-content:space-between;margin-top:12px;">
  <p-button label="Add Band" icon="pi pi-plus" severity="secondary" [outlined]="true" (onClick)="addRow()"></p-button>
  <p-button label="Save Grade Bands" icon="pi pi-check" [loading]="saving()" (onClick)="save()"></p-button>
</div>
